<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FocusFlow">
<title>FocusFlow</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #22223a;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --accent: #e8553e;
  --accent2: #3eb8a8;
  --accent3: #f0c040;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; overflow: hidden; }

/* NAV */
.app { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; position: relative; }
.nav { display: flex; justify-content: space-around; padding: 10px 16px 20px; background: var(--surface); border-top: 0.5px solid var(--border); position: relative; z-index: 10; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; cursor: pointer; padding: 8px 20px; border-radius: var(--radius-sm); transition: all 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; }

/* SCREENS */
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; display: none; flex-direction: column; }
.screen.active { display: flex; }

/* =========== POMODORO =========== */
#screen-pomo { padding: 24px 20px 16px; align-items: center; }
.pomo-header { width: 100%; margin-bottom: 24px; }
.pomo-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 300; color: var(--text); }
.pomo-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.mode-pills { display: flex; gap: 8px; margin-bottom: 28px; }
.pill { padding: 7px 16px; border-radius: 20px; border: 0.5px solid var(--border2); background: transparent; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; transition: all 0.2s; }
.pill.active { background: var(--accent); color: white; border-color: var(--accent); }
.pill.break-active { background: var(--accent2); color: white; border-color: var(--accent2); }

.timer-wrap { position: relative; width: 240px; height: 240px; margin-bottom: 28px; }
.timer-svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
.timer-circle-bg { fill: none; stroke: var(--surface2); stroke-width: 6; }
.timer-circle { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s; }
.timer-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.timer-time { font-family: 'Fraunces', serif; font-size: 52px; font-weight: 300; letter-spacing: -2px; color: var(--text); }
.timer-mode-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

.pomo-controls { display: flex; align-items: center; gap: 20px; margin-bottom: 32px; }
.ctrl-btn { width: 44px; height: 44px; border-radius: 50%; border: 0.5px solid var(--border2); background: var(--surface2); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.ctrl-btn:hover { color: var(--text); }
.ctrl-main { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, background 0.3s; }
.ctrl-main:active { transform: scale(0.95); }
.ctrl-main.break { background: var(--accent2); }
.ctrl-main svg { width: 26px; height: 26px; }

.cycle-dots { display: flex; gap: 8px; margin-bottom: 24px; }
.cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); border: 0.5px solid var(--border2); transition: background 0.3s; }
.cdot.done { background: var(--accent); border-color: var(--accent); }

.pomo-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-bottom: 20px; }
.pstat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; }
.pstat-val { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--text); }
.pstat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

.pomo-settings { width: 100%; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px 0; }
.srow { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 0.5px solid var(--border); }
.srow:last-child { border-bottom: none; }
.slabel { font-size: 12px; color: var(--muted); }
.sctrl { display: flex; align-items: center; gap: 10px; }
.snbtn { width: 28px; height: 28px; border-radius: 8px; border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.snval { font-size: 13px; min-width: 36px; text-align: center; color: var(--text); }

/* =========== TRACKER =========== */
#screen-tracker { padding: 0; }
.tracker-top { padding: 24px 20px 0; flex-shrink: 0; }
.tracker-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 300; }
.tracker-sub { font-size: 11px; color: var(--muted); margin-top: 2px; margin-bottom: 20px; }

.budget-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 0 20px 20px; }
.budget-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.budget-spent { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 300; }
.budget-total { font-size: 13px; color: var(--muted); }
.budget-bar-bg { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.budget-bar { height: 5px; border-radius: 3px; background: var(--accent2); transition: width 0.4s ease; }
.budget-bar.warn { background: var(--accent3); }
.budget-bar.danger { background: var(--accent); }
.budget-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

.cat-scroll { display: flex; gap: 8px; padding: 0 20px 16px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-chip { padding: 6px 14px; border-radius: 20px; border: 0.5px solid var(--border2); background: transparent; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; }
.cat-chip.active { background: var(--surface2); color: var(--text); border-color: var(--border2); }

.expenses-list { flex: 1; overflow-y: auto; padding: 0 20px 16px; }
.expense-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 0.5px solid var(--border); }
.expense-item:last-child { border-bottom: none; }
.exp-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.exp-info { flex: 1; min-width: 0; }
.exp-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-cat { font-size: 11px; color: var(--muted); margin-top: 2px; }
.exp-right { text-align: right; flex-shrink: 0; }
.exp-amount { font-family: 'Fraunces', serif; font-size: 16px; color: var(--text); }
.exp-date { font-size: 10px; color: var(--muted); margin-top: 2px; }
.exp-del { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; font-size: 16px; opacity: 0; transition: opacity 0.2s; }
.expense-item:hover .exp-del { opacity: 1; }

.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 8px; padding: 40px; text-align: center; }
.empty-state .big { font-family: 'Fraunces', serif; font-size: 48px; }
.empty-state p { font-size: 12px; line-height: 1.6; }

/* FAB */
.fab { position: fixed; bottom: 90px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); border: none; color: white; font-size: 26px; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(232,85,62,0.4); z-index: 20; transition: transform 0.15s; }
.fab:active { transform: scale(0.93); }
.fab.visible { display: flex; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; padding: 24px 20px 40px; width: 100%; max-width: 480px; animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 300; margin-bottom: 20px; }
.modal-field { margin-bottom: 16px; }
.modal-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: block; }
.modal-input { width: 100%; padding: 12px 14px; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; outline: none; }
.modal-input:focus { border-color: var(--accent); }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-opt { padding: 10px 6px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--surface2); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 10px; text-align: center; cursor: pointer; transition: all 0.15s; }
.cat-opt.selected { border-color: var(--accent); color: var(--accent); background: rgba(232,85,62,0.1); }
.cat-opt .cat-icon { font-size: 20px; display: block; margin-bottom: 4px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-cancel { flex: 1; padding: 13px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: transparent; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 13px; cursor: pointer; }
.btn-save { flex: 2; padding: 13px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: white; font-family: 'DM Mono', monospace; font-size: 13px; cursor: pointer; }

/* BUDGET MODAL */
.budget-modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; padding: 24px 20px 40px; width: 100%; max-width: 480px; animation: slideUp 0.25s ease; }

/* scrollbar */
.screen::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div class="app">

  <!-- POMODORO SCREEN -->
  <div class="screen active" id="screen-pomo">
    <div class="pomo-header">
      <div class="pomo-title">Focus</div>
      <div class="pomo-sub" id="pomo-date">Loading...</div>
    </div>

    <div class="mode-pills">
      <button class="pill active" id="pill-work" onclick="setMode('work')">Focus</button>
      <button class="pill" id="pill-short" onclick="setMode('short')">Short break</button>
      <button class="pill" id="pill-long" onclick="setMode('long')">Long break</button>
    </div>

    <div class="timer-wrap">
      <svg class="timer-svg" width="240" height="240" viewBox="0 0 240 240">
        <circle class="timer-circle-bg" cx="120" cy="120" r="108"/>
        <circle class="timer-circle" id="timer-circle" cx="120" cy="120" r="108"
          stroke-dasharray="678.6" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-inner">
        <div class="timer-time" id="timer-display">25:00</div>
        <div class="timer-mode-lbl" id="timer-mode-lbl">focus time</div>
      </div>
    </div>

    <div class="pomo-controls">
      <button class="ctrl-btn" onclick="resetTimer()" title="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="ctrl-main" id="play-btn" onclick="toggleTimer()">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="skipSession()" title="Skip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>

    <div class="cycle-dots" id="cycle-dots"></div>

    <div class="pomo-stats">
      <div class="pstat"><div class="pstat-val" id="stat-sessions">0</div><div class="pstat-lbl">sessions</div></div>
      <div class="pstat"><div class="pstat-val" id="stat-focus">0m</div><div class="pstat-lbl">focused</div></div>
      <div class="pstat"><div class="pstat-val" id="stat-streak">0</div><div class="pstat-lbl">streak 🔥</div></div>
    </div>

    <div class="pomo-settings">
      <div class="srow">
        <span class="slabel">Focus duration</span>
        <div class="sctrl">
          <button class="snbtn" onclick="adjustSetting('work',-1)">−</button>
          <span class="snval" id="set-work">25m</span>
          <button class="snbtn" onclick="adjustSetting('work',1)">+</button>
        </div>
      </div>
      <div class="srow">
        <span class="slabel">Short break</span>
        <div class="sctrl">
          <button class="snbtn" onclick="adjustSetting('short',-1)">−</button>
          <span class="snval" id="set-short">5m</span>
          <button class="snbtn" onclick="adjustSetting('short',1)">+</button>
        </div>
      </div>
      <div class="srow">
        <span class="slabel">Long break</span>
        <div class="sctrl">
          <button class="snbtn" onclick="adjustSetting('long',-1)">−</button>
          <span class="snval" id="set-long">15m</span>
          <button class="snbtn" onclick="adjustSetting('long',1)">+</button>
        </div>
      </div>
      <div class="srow">
        <span class="slabel">Sessions before long break</span>
        <div class="sctrl">
          <button class="snbtn" onclick="adjustSetting('cycle',-1)">−</button>
          <span class="snval" id="set-cycle">4</span>
          <button class="snbtn" onclick="adjustSetting('cycle',1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TRACKER SCREEN -->
  <div class="screen" id="screen-tracker">
    <div class="tracker-top">
      <div class="tracker-title">Spending</div>
      <div class="tracker-sub" id="tracker-month">Loading...</div>

      <div class="budget-card">
        <div class="budget-row">
          <span class="budget-spent" id="b-spent">CA$0</span>
          <span class="budget-total">of <span id="b-total">CA$2,000</span> budget <button onclick="openBudgetModal()" style="background:none;border:none;color:var(--accent);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;">edit</button></span>
        </div>
        <div class="budget-bar-bg">
          <div class="budget-bar" id="budget-bar" style="width:0%"></div>
        </div>
        <div class="budget-meta">
          <span id="b-remaining">CA$2,000 remaining</span>
          <span id="b-pct">0%</span>
        </div>
      </div>
    </div>

    <div class="cat-scroll" id="cat-scroll">
      <button class="cat-chip active" data-cat="all" onclick="filterCat(this,'all')">All</button>
      <button class="cat-chip" data-cat="🍔 Food" onclick="filterCat(this,'🍔 Food')">🍔 Food</button>
      <button class="cat-chip" data-cat="🚌 Transport" onclick="filterCat(this,'🚌 Transport')">🚌 Transport</button>
      <button class="cat-chip" data-cat="🛒 Groceries" onclick="filterCat(this,'🛒 Groceries')">🛒 Groceries</button>
      <button class="cat-chip" data-cat="💊 Health" onclick="filterCat(this,'💊 Health')">💊 Health</button>
      <button class="cat-chip" data-cat="🎮 Fun" onclick="filterCat(this,'🎮 Fun')">🎮 Fun</button>
      <button class="cat-chip" data-cat="🏠 Housing" onclick="filterCat(this,'🏠 Housing')">🏠 Housing</button>
      <button class="cat-chip" data-cat="📱 Subscriptions" onclick="filterCat(this,'📱 Subscriptions')">📱 Subscriptions</button>
      <button class="cat-chip" data-cat="✈️ Travel" onclick="filterCat(this,'✈️ Travel')">✈️ Travel</button>
      <button class="cat-chip" data-cat="📦 Other" onclick="filterCat(this,'📦 Other')">📦 Other</button>
    </div>

    <div class="expenses-list" id="expenses-list"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="nav">
    <button class="nav-btn active" id="nav-pomo" onclick="switchScreen('pomo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
      Focus
    </button>
    <button class="nav-btn" id="nav-tracker" onclick="switchScreen('tracker')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Spending
    </button>
  </nav>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openAddModal()">+</button>

<!-- ADD EXPENSE MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-title">Add expense</div>
    <div class="modal-field">
      <label class="modal-label">Description</label>
      <input class="modal-input" id="exp-name-input" type="text" placeholder="e.g. Tim Hortons">
    </div>
    <div class="modal-field">
      <label class="modal-label">Amount (CAD)</label>
      <input class="modal-input" id="exp-amount-input" type="number" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <div class="modal-field">
      <label class="modal-label">Category</label>
      <div class="cat-grid" id="cat-grid">
        <button class="cat-opt selected" data-cat="🍔 Food" onclick="selectCat(this)"><span class="cat-icon">🍔</span>Food</button>
        <button class="cat-opt" data-cat="🚌 Transport" onclick="selectCat(this)"><span class="cat-icon">🚌</span>Transport</button>
        <button class="cat-opt" data-cat="🛒 Groceries" onclick="selectCat(this)"><span class="cat-icon">🛒</span>Groceries</button>
        <button class="cat-opt" data-cat="💊 Health" onclick="selectCat(this)"><span class="cat-icon">💊</span>Health</button>
        <button class="cat-opt" data-cat="🎮 Fun" onclick="selectCat(this)"><span class="cat-icon">🎮</span>Fun</button>
        <button class="cat-opt" data-cat="🏠 Housing" onclick="selectCat(this)"><span class="cat-icon">🏠</span>Housing</button>
        <button class="cat-opt" data-cat="📱 Subscriptions" onclick="selectCat(this)"><span class="cat-icon">📱</span>Subs</button>
        <button class="cat-opt" data-cat="📦 Other" onclick="selectCat(this)"><span class="cat-icon">📦</span>Other</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveExpense()">Add expense</button>
    </div>
  </div>
</div>

<!-- BUDGET MODAL -->
<div class="modal-overlay" id="budget-modal">
  <div class="budget-modal">
    <div class="modal-title">Monthly budget</div>
    <div class="modal-field">
      <label class="modal-label">Budget (CAD)</label>
      <input class="modal-input" id="budget-input" type="number" step="50" placeholder="2000" inputmode="decimal">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeBudgetModal()">Cancel</button>
      <button class="btn-save" onclick="saveBudget()">Save</button>
    </div>
  </div>
</div>

<script>
// =================== DATA ===================
const STORE_POMO = 'ff_pomo_stats';
const STORE_EXP = 'ff_expenses';
const STORE_BUDGET = 'ff_budget';
const STORE_SETTINGS = 'ff_settings';

function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// =================== SCREEN SWITCH ===================
let currentScreen = 'pomo';
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  currentScreen = name;
  document.getElementById('fab').classList.toggle('visible', name === 'tracker');
}

// =================== POMODORO ===================
const settings = load(STORE_SETTINGS, { work: 25, short: 5, long: 15, cycle: 4 });
const settingLimits = { work: [1,60], short: [1,30], long: [5,60], cycle: [2,8] };
let pomoMode = 'work';
let totalSeconds = settings.work * 60;
let remaining = totalSeconds;
let running = false;
let interval = null;
let sessionInCycle = 0;
let pomoStats = load(STORE_POMO, { sessions: 0, focusMins: 0, streak: 0, lastDate: '' });

function todayStr() { return new Date().toISOString().split('T')[0]; }

function checkStreak() {
  const today = todayStr();
  if (pomoStats.lastDate !== today) {
    if (pomoStats.lastDate === '') {
      pomoStats.streak = 0;
    }
  }
}

function setMode(m) {
  pomoMode = m;
  running = false;
  clearInterval(interval);
  document.getElementById('play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  document.getElementById('play-btn').classList.toggle('break', m !== 'work');
  const durations = { work: settings.work, short: settings.short, long: settings.long };
  totalSeconds = durations[m] * 60;
  remaining = totalSeconds;
  updateTimerDisplay();
  ['work','short','long'].forEach((k,i) => {
    const pill = document.getElementById('pill-' + k);
    pill.className = 'pill' + (k === m ? (m === 'work' ? ' active' : ' break-active') : '');
  });
  const labels = { work: 'focus time', short: 'short break', long: 'long break' };
  document.getElementById('timer-mode-lbl').textContent = labels[m];
  const circle = document.getElementById('timer-circle');
  circle.style.stroke = m === 'work' ? 'var(--accent)' : 'var(--accent2)';
}

function updateTimerDisplay() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  document.getElementById('timer-display').textContent =
    String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  const circ = 2 * Math.PI * 108;
  const pct = remaining / totalSeconds;
  document.getElementById('timer-circle').style.strokeDashoffset = circ * (1 - pct);
  if ('serviceWorker' in navigator && running) {
    document.title = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + ' — FocusFlow';
  } else { document.title = 'FocusFlow'; }
}

function toggleTimer() {
  if (running) {
    running = false;
    clearInterval(interval);
    document.getElementById('play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  } else {
    running = true;
    document.getElementById('play-icon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    interval = setInterval(tick, 1000);
  }
}

function tick() {
  if (remaining > 0) {
    remaining--;
    if (pomoMode === 'work') {
      pomoStats.focusMins = Math.round(pomoStats.focusMins + 1/60 * 10) / 10;
    }
    updateTimerDisplay();
    updatePomoStats();
  } else {
    clearInterval(interval);
    running = false;
    document.getElementById('play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
    onSessionEnd();
    if (Notification.permission === 'granted') {
      new Notification('FocusFlow', { body: pomoMode === 'work' ? 'Session done! Time to rest.' : 'Break over — back to focus!', icon: '' });
    }
  }
}

function onSessionEnd() {
  if (pomoMode === 'work') {
    pomoStats.sessions++;
    pomoStats.streak++;
    pomoStats.lastDate = todayStr();
    sessionInCycle++;
    save(STORE_POMO, pomoStats);
    updateCycleDots();
    updatePomoStats();
    setMode(sessionInCycle >= settings.cycle ? 'long' : 'short');
    if (sessionInCycle >= settings.cycle) sessionInCycle = 0;
  } else {
    setMode('work');
  }
}

function skipSession() { clearInterval(interval); running = false; onSessionEnd(); }
function resetTimer() {
  clearInterval(interval); running = false;
  document.getElementById('play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
  totalSeconds = settings[pomoMode] * 60; remaining = totalSeconds;
  updateTimerDisplay();
}

function updatePomoStats() {
  document.getElementById('stat-sessions').textContent = pomoStats.sessions;
  document.getElementById('stat-focus').textContent = Math.round(pomoStats.focusMins) + 'm';
  document.getElementById('stat-streak').textContent = pomoStats.streak;
}

function updateCycleDots() {
  const container = document.getElementById('cycle-dots');
  container.innerHTML = '';
  for (let i = 0; i < settings.cycle; i++) {
    const d = document.createElement('div');
    d.className = 'cdot' + (i < sessionInCycle ? ' done' : '');
    container.appendChild(d);
  }
}

function adjustSetting(key, delta) {
  const [min, max] = settingLimits[key];
  settings[key] = Math.min(max, Math.max(min, settings[key] + delta));
  const units = key === 'cycle' ? '' : 'm';
  document.getElementById('set-' + key).textContent = settings[key] + units;
  save(STORE_SETTINGS, settings);
  if ((key === 'work' && pomoMode === 'work') || (key === 'short' && pomoMode === 'short') || (key === 'long' && pomoMode === 'long')) {
    totalSeconds = settings[key] * 60; remaining = totalSeconds;
    updateTimerDisplay();
  }
  if (key === 'cycle') updateCycleDots();
}

// =================== EXPENSES ===================
let expenses = load(STORE_EXP, []);
let budget = load(STORE_BUDGET, 2000);
let activeFilter = 'all';
let selectedCat = '🍔 Food';

function getMonthKey() {
  const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0');
}
function getThisMonthExpenses() {
  const mk = getMonthKey();
  return expenses.filter(e => e.month === mk);
}

function updateBudgetCard() {
  const me = getThisMonthExpenses();
  const spent = me.reduce((a,e) => a + e.amount, 0);
  const pct = budget > 0 ? Math.min(100, Math.round(spent / budget * 100)) : 0;
  const remaining = budget - spent;
  document.getElementById('b-spent').textContent = 'CA$' + spent.toFixed(2);
  document.getElementById('b-total').textContent = 'CA$' + budget.toFixed(0);
  document.getElementById('b-remaining').textContent = (remaining >= 0 ? 'CA$' + remaining.toFixed(2) + ' remaining' : 'CA$' + Math.abs(remaining).toFixed(2) + ' over budget');
  document.getElementById('b-pct').textContent = pct + '%';
  const bar = document.getElementById('budget-bar');
  bar.style.width = pct + '%';
  bar.className = 'budget-bar' + (pct > 90 ? ' danger' : pct > 70 ? ' warn' : '');
}

function renderExpenses() {
  const me = getThisMonthExpenses();
  const filtered = activeFilter === 'all' ? me : me.filter(e => e.category === activeFilter);
  const list = document.getElementById('expenses-list');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="big">🧾</div><p>No expenses yet.<br>Tap + to add one.</p></div>';
    return;
  }
  const sorted = [...filtered].sort((a,b) => new Date(b.date) - new Date(a.date));
  list.innerHTML = sorted.map(e => `
    <div class="expense-item">
      <div class="exp-icon">${e.category.split(' ')[0]}</div>
      <div class="exp-info">
        <div class="exp-name">${e.name}</div>
        <div class="exp-cat">${e.category}</div>
      </div>
      <div class="exp-right">
        <div class="exp-amount">CA$${e.amount.toFixed(2)}</div>
        <div class="exp-date">${formatDate(e.date)}</div>
      </div>
      <button class="exp-del" onclick="deleteExpense('${e.id}')">×</button>
    </div>
  `).join('');
}

function formatDate(d) {
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
}

function filterCat(btn, cat) {
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = cat;
  renderExpenses();
}

function selectCat(btn) {
  document.querySelectorAll('.cat-opt').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedCat = btn.dataset.cat;
}

function openAddModal() {
  document.getElementById('exp-name-input').value = '';
  document.getElementById('exp-amount-input').value = '';
  document.getElementById('add-modal').classList.add('open');
  setTimeout(() => document.getElementById('exp-name-input').focus(), 300);
}
function closeModal() { document.getElementById('add-modal').classList.remove('open'); }

function saveExpense() {
  const name = document.getElementById('exp-name-input').value.trim();
  const amount = parseFloat(document.getElementById('exp-amount-input').value);
  if (!name || isNaN(amount) || amount <= 0) return;
  const expense = {
    id: Date.now().toString(),
    name, amount,
    category: selectedCat,
    date: new Date().toISOString().split('T')[0],
    month: getMonthKey()
  };
  expenses.push(expense);
  save(STORE_EXP, expenses);
  closeModal();
  updateBudgetCard();
  renderExpenses();
}

function deleteExpense(id) {
  expenses = expenses.filter(e => e.id !== id);
  save(STORE_EXP, expenses);
  updateBudgetCard();
  renderExpenses();
}

function openBudgetModal() {
  document.getElementById('budget-input').value = budget;
  document.getElementById('budget-modal').classList.add('open');
}
function closeBudgetModal() { document.getElementById('budget-modal').classList.remove('open'); }
function saveBudget() {
  const val = parseFloat(document.getElementById('budget-input').value);
  if (!isNaN(val) && val > 0) { budget = val; save(STORE_BUDGET, budget); }
  closeBudgetModal();
  updateBudgetCard();
}

// close modals on overlay click
document.getElementById('add-modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.getElementById('budget-modal').addEventListener('click', function(e) { if (e.target === this) closeBudgetModal(); });

// =================== INIT ===================
function init() {
  const now = new Date();
  document.getElementById('pomo-date').textContent = now.toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('tracker-month').textContent = now.toLocaleDateString('en-CA', { month: 'long', year: 'numeric' });
  document.getElementById('set-work').textContent = settings.work + 'm';
  document.getElementById('set-short').textContent = settings.short + 'm';
  document.getElementById('set-long').textContent = settings.long + 'm';
  document.getElementById('set-cycle').textContent = settings.cycle;
  updateTimerDisplay();
  updateCycleDots();
  checkStreak();
  updatePomoStats();
  updateBudgetCard();
  renderExpenses();
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
